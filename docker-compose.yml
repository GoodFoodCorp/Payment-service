services:
  payment-service:
    build: .
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@payment-db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      payment-db:
        condition: service_healthy
    networks:
      - microservices-net

  payment-db:
    image: postgres:17-alpine
    container_name: payment-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5436:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Stripe test mode, locally: forwards the account's webhooks to the service
  # (Stripe cannot reach localhost). Opt-in: docker compose --profile stripe up -d
  # Needs STRIPE_SECRET_KEY (sk_test_) in .env; copy the "whsec_" secret it
  # prints at start into STRIPE_WEBHOOK_SECRET, then restart payment-service.
  stripe-cli:
    image: stripe/stripe-cli:v1.21.8
    container_name: stripe-cli
    profiles: ["stripe"]
    restart: unless-stopped
    command: >
      listen --api-key ${STRIPE_SECRET_KEY:-}
      --forward-to http://payment-service:8086/api/payments/webhooks/stripe
      --events payment_intent.succeeded,payment_intent.payment_failed,payment_intent.canceled,charge.refunded
    networks:
      - microservices-net

networks:
  microservices-net:
    external: true
volumes:
  payment_data:
